# review-cli config for Uniswap/tjar.
# Schema reference: packages/review-cli/src/config.ts in Uniswap/internal-tools.
#
# tjar is a Foundry Solidity repo: non-upgradeable fee-collection contracts
# with deterministic singletons on six chains and permissionless release
# calls. The engineering context every reviewer reads lives in
# .claude/review-context.md, not here.

# ─── Post Policy ───────────────────────────────────
# Only CI may write to GitHub. Without this, any local `gh` token with
# repo scope could post a review into a teammate's PR.
post:
  allowed_actors:
    - github-actions
    - github-actions[bot]

# ─── Model ─────────────────────────────────────────
# Opus for every reviewer. The bundled agents declare `model: sonnet` in
# frontmatter, which resolve-model treats as "unpinned", so this default
# is what actually selects the model. Deployed immutable contracts
# holding protocol fees justify the most capable reviewer available —
# a missed finding here is not a bug report, it is a redeploy plus a
# governance action.
#
# Uniswap/universe additionally pins a separate `synthesis:` model; left
# unset here so synthesis inherits the same default.
model:
  default: claude-opus-5

# ─── Budget ────────────────────────────────────────
# Well above the $5/$2 defaults. This is a small codebase but a
# high-consequence one — reviewers should be free to read every
# releaser, base contract, and test rather than stopping early.
# Whole-run ceiling, stated as intent only: review-cli 1.10.7 and 1.12.0
# parse max_budget_usd but enforce only the per-agent budget below, so the
# real ceiling is agent_budget_usd times every agent staffed. The triage
# guidance staffs four or more reviewers on a Solidity change; with triage
# and synthesis that is six agents, or $60 at the per-agent cap, so this
# number records intent rather than a limit anything enforces.
max_budget_usd: 40.0
agent_budget_usd: 10.0

# Turn ceiling set high so the budget is always the binding cap, never
# turns.
agent_max_turns: 500

# ─── Limits ────────────────────────────────────────
# Review every PR regardless of size. A one-line change to a threshold,
# a nonce check, or an asset loop is exactly the kind of diff that is
# both tiny and load-bearing here.
trivial_threshold: 0

# ─── Investigation Gate ────────────────────────────
# An empty-findings APPROVE must be backed by evidence that the
# reviewers actually opened the changed files. Raised above the defaults
# (0.25 standard / 0.5 thorough) because "looks fine" is not an
# acceptable review outcome for deployed contract code.
investigation:
  min_approve_coverage:
    light: 0.5
    standard: 0.75
    thorough: 0.9

# ─── Triage ────────────────────────────────────────
# Guidance for the triage agent, which decides which reviewers to staff.
triage:
  guidance: |
    Solidity/Foundry repo — the Uniswap protocol fee collection system.
    Non-upgradeable contracts with deterministic Factory and FeeController
    deployments on Ethereum, Optimism, Polygon, Base, Arbitrum, and
    Robinhood Chain. The repository includes Cantina and OpenZeppelin
    reports under audit/. A live-contract fix requires a new deployment
    and the relevant jar-owner or governance action, not only a source
    patch. Bias toward staffing more reviewers rather than fewer.

    Always staff contract-security-reviewer and defi-risk-reviewer on any
    change under src/. Both are the point of this repo, not optional
    extras:

    - contract-security-reviewer owns the EVM-level surface: jar
      `owner` / `releaser`, releaser `owner` / `configSetter`, and
      FeeController `owner` authority; the transient-storage reentrancy
      guards; hostile-token behavior; nonce invalidation on atomic config
      updates; Factory CREATE2 salt scoping and authority handoff; and the
      external call into the OP Stack L2StandardBridge.

    - defi-risk-reviewer owns the economic surface: the fixed-threshold
      exchange is deliberately a searcher race, so changes to `resource`,
      `resourceRecipient`, `threshold`, `maxReleaseLength`, protocol-fee
      calculation, `maxFee`, nonce sequencing, or selected assets change
      execution terms and profitability. ExchangeReleaser's docstring
      flags MEV considerations; treat that as an open risk area.

    Add correctness-reviewer on non-trivial logic changes, especially
    anything touching the asset loop, fee rounding, nonce arithmetic,
    Factory ownership handoff, or the two-stage bridge sequencing where
    a revert in the bridge hook must unwind collection and the jar sweep.

    Add security-reviewer for CI/workflow changes under .github/ and for
    anything handling secrets or tokens. Skip it for pure Solidity diffs
    — contract-security-reviewer covers that surface better.

    Add patterns-reviewer only on larger refactors. This codebase is
    small and deliberately minimal; structural advice on a 45-line
    contract is usually noise.

    Documentation-only diffs (README.md, SEARCHERS.md, script/README.md,
    audit/) usually warrant general-reviewer alone. Deployment addresses,
    CREATE2 inputs, fee behavior, and operational guidance still need to
    be checked against the source and live-deployment assumptions.
